<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>WebNotes</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "on-surface": "#2e3335",
            "on-secondary": "#f8f8ff",
            "surface-bright": "#f9f9f9",
            "primary": "#0060ac",
            "tertiary-fixed": "#ddddfe",
            "error-dim": "#4e0309",
            "on-secondary-container": "#4f5257",
            "primary-fixed-dim": "#bcd6ff",
            "error": "#9f403d",
            "on-tertiary-fixed-variant": "#565873",
            "primary-dim": "#005397",
            "on-background": "#2e3335",
            "on-primary-fixed-variant": "#005da7",
            "secondary-dim": "#515358",
            "on-primary-fixed": "#004076",
            "error-container": "#fe8983",
            "inverse-surface": "#0d0e0f",
            "outline-variant": "#adb3b4",
            "secondary-fixed-dim": "#d3d4da",
            "secondary-fixed": "#e1e2e9",
            "surface-container-lowest": "#ffffff",
            "on-primary": "#f6f7ff",
            "on-tertiary": "#fbf8ff",
            "tertiary": "#5b5d78",
            "on-tertiary-container": "#4c4e69",
            "on-tertiary-fixed": "#3a3c55",
            "surface-container": "#eceeef",
            "tertiary-container": "#ddddfe",
            "on-surface-variant": "#5a6061",
            "tertiary-dim": "#4f516c",
            "primary-container": "#d4e3ff",
            "inverse-on-surface": "#9c9d9d",
            "inverse-primary": "#68abff",
            "tertiary-fixed-dim": "#cecfef",
            "surface-dim": "#d4dbdd",
            "background": "#f9f9f9",
            "surface-container-highest": "#dee3e4",
            "on-error": "#fff7f6",
            "on-secondary-fixed": "#3d3f44",
            "secondary": "#5d5f64",
            "on-error-container": "#752121",
            "surface-container-low": "#f3f4f4",
            "on-primary-container": "#005396",
            "outline": "#767c7d",
            "surface-tint": "#0060ac",
            "surface-variant": "#dee3e4",
            "primary-fixed": "#d4e3ff",
            "surface-container-high": "#e5e9ea",
            "on-secondary-fixed-variant": "#595b61",
            "secondary-container": "#e1e2e9",
            "surface": "#f9f9f9"
          },
          fontFamily: {
            headline: ["Manrope"],
            body: ["Inter"],
            label: ["Inter"]
          },
          borderRadius: { DEFAULT: "0.125rem", lg: "0.25rem", xl: "0.5rem", full: "0.75rem" }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="popup.css" />
  <style>
    body {
      width: 350px;
      height: 500px;
      overflow: hidden;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #adb3b4;
      border-radius: 10px;
    }
    .material-symbols-outlined {
      font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
    }
    .hidden-view {
      display: none;
    }
  </style>
</head>
<body class="bg-surface font-body text-on-surface selection:bg-primary-fixed-dim">
  <div class="flex flex-col h-full bg-surface-bright">
    <!-- HEADER -->
    <header class="flex justify-between items-center px-6 py-4 w-full bg-slate-50 dark:bg-zinc-900">
      <div class="text-xl font-bold tracking-tighter text-zinc-800 dark:text-zinc-100 flex items-center gap-2">
        <span class="material-symbols-outlined text-blue-600" data-icon="edit_note">edit_note</span>
        <span class="font-headline text-lg tracking-tight">Web Notes</span>
      </div>
      <div class="flex gap-2">
        <button id="themeToggleBtn" class="p-1.5 rounded-full hover:bg-zinc-200/50 dark:hover:bg-zinc-700/50 transition-colors active:scale-95 duration-150" title="Toggle dark mode">
          <span class="material-symbols-outlined text-zinc-500 dark:text-zinc-400 text-lg" data-icon="dark_mode">dark_mode</span>
        </button>
        <button id="settingsBtn" class="p-1.5 rounded-full hover:bg-zinc-200/50 dark:hover:bg-zinc-700/50 transition-colors active:scale-95 duration-150" title="Settings">
          <span class="material-symbols-outlined text-zinc-500 dark:text-zinc-400 text-lg" data-icon="settings">settings</span>
        </button>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-1 overflow-y-auto custom-scrollbar p-6 space-y-5">
      <!-- EDITOR VIEW -->
      <div id="viewEditor" class="editor-view space-y-4">
        <!-- Site indicator -->
        <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-secondary-container w-fit">
          <div class="w-4 h-4 bg-white rounded flex items-center justify-center overflow-hidden">
            <img id="siteFavicon" alt="Favicon" class="w-full h-full object-contain" />
          </div>
          <span class="text-[0.6875rem] font-medium text-on-secondary-container tracking-tight">Notes for: <span id="siteDomain">this page</span></span>
        </div>

        <!-- Textarea -->
        <div class="relative group">
          <textarea id="noteTextarea" class="w-full h-32 p-4 bg-surface-container-lowest border-none rounded-xl text-sm focus:ring-2 focus:ring-primary/30 focus:bg-white dark:focus:bg-zinc-800 transition-all placeholder:text-on-surface-variant/40 resize-none shadow-[0_4px_12px_-4px_rgba(46,51,53,0.06)]" placeholder="Write your notes for this page..."></textarea>
          <div class="absolute bottom-3 right-4 flex items-center gap-1.5 opacity-60">
            <span class="material-symbols-outlined text-[14px]" data-icon="cloud_done">cloud_done</span>
            <span id="saveStatus" class="text-[10px] font-label">Auto-saved</span>
          </div>
        </div>

        <!-- Actions -->
        <div class="flex items-center justify-between gap-3">
          <div class="flex gap-2">
            <button id="saveBtn" class="bg-primary hover:bg-primary-dim text-white px-4 py-2 rounded-xl text-xs font-semibold transition-all active:scale-95 shadow-sm">Save Note</button>
            <button id="deleteBtn" class="bg-surface-container-high hover:bg-surface-dim text-on-surface-variant px-4 py-2 rounded-xl text-xs font-medium transition-all active:scale-95">Clear</button>
          </div>
          <button id="openSidebarBtn" class="text-primary hover:bg-primary/10 p-2 rounded-xl transition-all" title="Toggle sidebar">
            <span class="material-symbols-outlined text-lg" data-icon="view_sidebar">view_sidebar</span>
          </button>
        </div>

        <!-- Tags & Word count -->
        <div class="flex items-center justify-between gap-3 text-[0.6875rem] text-on-surface-variant">
          <div class="flex items-center gap-2">
            <input id="tagsInput" type="text" class="bg-surface-container-lowest border border-outline rounded-lg px-2 py-1 text-xs focus:ring-1 focus:ring-primary focus:border-primary" placeholder="Add tags..." />
          </div>
          <div id="wordCount" class="font-medium">0 words</div>
        </div>
      </div>

      <!-- ALL NOTES VIEW (Hidden by default) -->
      <div id="viewAllNotes" class="all-notes-view space-y-3 hidden-view">
        <div class="flex items-center justify-between">
          <h3 class="text-[0.6875rem] font-bold tracking-widest text-on-surface-variant uppercase">Search Notes</h3>
          <button id="exportBtn" class="text-[11px] font-semibold text-primary hover:text-primary-dim transition-colors">Export .txt</button>
        </div>
        <input id="searchInput" type="text" class="w-full bg-surface-container-lowest border border-outline rounded-lg px-3 py-2 text-xs focus:ring-1 focus:ring-primary focus:border-primary" placeholder="Search across all notes..." />
        <div id="searchResults" class="space-y-2 max-h-72 overflow-y-auto custom-scrollbar"></div>
      </div>

      <!-- HISTORY VIEW (Hidden by default) -->
      <div id="viewHistory" class="history-view space-y-3 hidden-view">
        <h3 class="text-[0.6875rem] font-bold tracking-widest text-on-surface-variant uppercase">Previous Notes</h3>
        <div id="historyResults" class="space-y-3"></div>
      </div>

      <!-- SETTINGS VIEW (Hidden by default) -->
      <div id="viewSettings" class="settings-view space-y-4 hidden-view">
        <h3 class="text-[0.6875rem] font-bold tracking-widest text-on-surface-variant uppercase">Settings</h3>
        <div class="space-y-3">
          <div class="p-3 bg-surface-container-lowest rounded-xl">
            <div class="text-xs font-medium text-on-surface mb-1">Theme</div>
            <div class="text-[0.6875rem] text-on-surface-variant">Dark mode is toggled in the header</div>
          </div>
        </div>
      </div>
    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="flex h-16 w-full py-2 px-4 bg-slate-100 dark:bg-zinc-950 items-center justify-around border-t border-outline-variant/10">
      <button id="tabEditorBtn" class="flex flex-col items-center justify-center gap-1 flex-1 text-blue-600 dark:text-blue-400 font-bold transition-colors tab-btn" data-tab="editor">
        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">edit_note</span>
        <span class="text-[10px] font-label">Editor</span>
      </button>
      <button id="tabHistoryBtn" class="flex flex-col items-center justify-center gap-1 flex-1 text-zinc-500 dark:text-zinc-400 hover:text-zinc-800 dark:hover:text-zinc-200 transition-colors tab-btn" data-tab="history">
        <span class="material-symbols-outlined">history</span>
        <span class="text-[10px] font-label">History</span>
      </button>
      <button id="tabAllBtn" class="flex flex-col items-center justify-center gap-1 flex-1 text-zinc-500 dark:text-zinc-400 hover:text-zinc-800 dark:hover:text-zinc-200 transition-colors tab-btn" data-tab="all">
        <span class="material-symbols-outlined">search</span>
        <span class="text-[10px] font-label">Search</span>
      </button>
    </nav>
  </div>

  <script src="popup.js"></script>
</body>
</html>
